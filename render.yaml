services:
  - type: web
    name: boka-market-backend
    env: docker
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # The rest of the keys (like the database connection) should be configured in the Render Dashboard securely.

  - type: web
    name: boka-studio
    runtime: static
    rootDir: boka-studio
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_ADMIN_INVITE_CODE
        sync: false
